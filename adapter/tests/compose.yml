services:
  adapter-image:
    profiles: [build]
    build:
      context: ../..
      dockerfile: adapter/Dockerfile
  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_PASSWORD: adapter-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  tests:
    build:
      context: ../..
      dockerfile: adapter/tests/Dockerfile
    environment:
      ADAPTER_TEST_ADMIN_DSN: host=db dbname=postgres user=postgres password=adapter-test-only
    depends_on:
      db:
        condition: service_healthy
  ui:
    image: smart-energy-adapter-tests-tests
    profiles: [ui]
    command: ["python", "-m", "adapter.tests.ui_server"]
    environment:
      ADAPTER_TEST_ADMIN_DSN: host=db dbname=postgres user=postgres password=adapter-test-only
    ports:
      - "127.0.0.1:15000:5000"
    depends_on:
      db:
        condition: service_healthy
