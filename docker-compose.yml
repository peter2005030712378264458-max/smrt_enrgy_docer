version: "3.8"

x-service-env-files: &service-env-files
  - ${ANALYTICS_ENV_FILE:-./Аналитический сервис/Analytical_service/.env.example}
  - ${BACKEND_ENV_FILE:-./Бэк/project_backend/.env.example}

x-database-environment: &database-environment
  POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
  POSTGRES_PORT: ${POSTGRES_PORT:-15432}
  POSTGRES_KEEPALIVES: "1"
  POSTGRES_KEEPALIVES_IDLE: "30"
  POSTGRES_KEEPALIVES_INTERVAL: "10"
  POSTGRES_KEEPALIVES_COUNT: "5"

services:
  analytical:
    image: smart-energy-local-analytical
    build:
      context: ./Аналитический сервис/Analytical_service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-8001}:8001"
    env_file: *service-env-files
    environment:
      <<: *database-environment
      ANALYTICS_POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      ANALYTICS_POSTGRES_PORT: ${POSTGRES_PORT:-15432}
    restart: unless-stopped

  backend:
    image: smart-energy-local-backend
    build:
      context: ./Бэк/project_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    env_file: *service-env-files
    environment:
      <<: *database-environment
      RUNNING_IN_DOCKER: "1"
      DJANGO_USE_GUNICORN: "1"
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY_FILE: /run/smart-energy/django_secret_key
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://localhost,https://127.0.0.1},https://localhost:${HTTPS_PORT:-443},https://127.0.0.1:${HTTPS_PORT:-443}
      DJANGO_TRUST_PROXY_HEADERS: "1"
      DJANGO_REFRESH_COOKIE_SECURE: "1"
      RUN_DJANGO_MIGRATIONS: "1"
      RUN_ENERGY_INDEXES: "0"
      ANALYTICS_SERVICE_URL: http://analytical:8001
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      GUNICORN_BIND: 0.0.0.0:5000
    volumes:
      - django-secret:/run/smart-energy
    depends_on:
      - analytical
    restart: unless-stopped

  frontend:
    image: smart-energy-local-frontend
    build:
      context: ./Фронт/smart_energy
      args:
        NGINX_CONFIG: nginx.conf
    ports:
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
    environment:
      API_PROXY_TARGET: http://backend:5000
    volumes:
      - ${TLS_CERTIFICATE_PATH:-./ssl/nginx.crt}:/etc/nginx/ssl/nginx.crt:ro
      - ${TLS_KEY_PATH:-./ssl/nginx.key}:/etc/nginx/ssl/nginx.key:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  django-secret:
    name: smart-energy-local_django-secret
